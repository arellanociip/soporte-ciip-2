<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoja de Servicio · GTIC · CIIP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23004090'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial,sans-serif' font-size='16' font-weight='800' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/estilo.css">
<style>
  /* La hoja, sola en la página. En la bandeja vive escondida hasta que se
     imprime; aquí es lo único que hay, porque esta página existe para eso: el
     servidor la abre sin ventana y la convierte en PDF. Y si alguien la abre a
     mano, ve el documento tal cual y puede imprimirlo con Ctrl+P. */
  body{background:#F4F7FB; margin:0; padding:24px 12px;}
  #impresion{display:block; max-width:816px; margin:0 auto;
             background:#fff; padding:34px 40px; box-shadow:0 8px 30px rgba(14,20,36,.12);}
  #malo{max-width:620px; margin:60px auto; font:14px/1.6 'Helvetica Neue',Arial,sans-serif;
        color:#5B6478; text-align:center;}
  @media print{
    body{background:#fff; padding:0;}
    #impresion{box-shadow:none; padding:0; max-width:none;}
  }
</style>
</head>
<body>

<div id="impresion"></div>
<div id="malo" hidden></div>

<script src="js/config.js"></script>
<script src="js/hoja.js"></script>
<script>
/* Se pide por el mismo camino que usa quien pidió el soporte para ver su
   estado: el id de la solicitud, que nadie adivina, es la prueba de que es
   suya. Sin id válido, aquí no hay nada que ver. */
(function(){
  'use strict';
  const filtro = new URLSearchParams(location.search).get('id') || '';
  const id = filtro.startsWith('eq.') ? filtro.slice(3) : filtro;

  function fallar(texto){
    document.getElementById('impresion').hidden = true;
    const m = document.getElementById('malo');
    m.textContent = texto;
    m.hidden = false;
  }

  if(!/^[0-9a-f-]{36}$/i.test(id)) return fallar('Esta dirección no lleva a ninguna Hoja de Servicio.');

  fetch(SOPORTE_BACKEND.url + '/rest/v1/solicitudes?id=eq.' + encodeURIComponent(id),
        {headers: soporteCabeceras()})
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(filas => {
      const s = filas[0];
      if(!s) return fallar('Esa solicitud ya no existe.');
      document.getElementById('impresion').innerHTML = hojaServicioHtml(s, {
        nombre: s.tecnico, cargo: s.tecnico_cargo,
        cedula: s.tecnico_cedula, telefono: s.tecnico_telefono,
      });
      document.title = 'Hoja de Servicio N° ' +
        String(s.numero).padStart(3, '0') + '-' + s.anio;
      /* la bandera que espera el servidor para saber que ya puede imprimirla */
      document.documentElement.setAttribute('data-lista', '1');
    })
    .catch(() => fallar('No se pudo traer la Hoja de Servicio. Vuelve a intentarlo.'));
})();
</script>
</body>
</html>
